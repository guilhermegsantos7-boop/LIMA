<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramação de elementos</title>
    <style>
       .container {
           width: 500px;
           height: 600px;
           border: 5px solid black;
           text-align: center;
           position: relative;
        
       
    }
    img {
          width: 100px;
          height: 100px;
          background-color: dodgerblue;
        
    }
    span {
         font-size: 20px;
         vertical-align: top;
    }
    .item1 {
         width: 150px;
         height: 150px;
         background-color: blue;
         display: inline-block;
         position: relative;
         left: 30px;
         z-index: 2;

        

    }
    .item2 {
        width: 150px;
        height: 150px;
        background-color: rgb(255, 0, 0);
        display: inline-block;
        position: absolute;
        right: 10px;
        z-index: 1;
    }
    </style>
</head>
<body>
    <div class="container">
        <p> lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. </p>
        <button>lorem</button>
    <div>
        <img>
        <span>Exemplo vertical-align</span>
        <div class="item1"> </div>
        <div class="item2"> </div>
    </div>
    </div>
</body>
</html>
